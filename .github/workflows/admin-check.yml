name: admin-check
on:
  push:
    branches: [ci-admin-check]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -B -q -Dtest=AdminPagesRenderTest -Dsurefire.failIfNoSpecifiedTests=false test || true
      - run: cat target/surefire-reports/*AdminPagesRenderTest*-output.txt 2>/dev/null | grep -E "^##|Caused by|Exception|SpelEval|TemplateInput|at jp\.komorebi" | head -150 || true
      - run: cat target/surefire-reports/*AdminPagesRenderTest.txt 2>/dev/null | head -60 || true
