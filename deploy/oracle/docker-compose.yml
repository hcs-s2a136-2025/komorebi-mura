# Oracle Cloud（Always Free）で動かすための設定。手順は docs/Oracleへの引っ越し.md
# 秘密（DB の接続情報・パスワード・招待コード）は、このフォルダの .env に書く（.env は Git に入れない）
services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy を通ると、遊ぶ人の住所が X-Forwarded-For で届く（村を作る回数の制限などに使う）
      FORWARD_HEADERS: native
      THYMELEAF_CACHE: "true"
      # 6GB の VM（Ampere）。メモリを2割より多く使っていないと「使っていない VM」として止められることがあるので、はじめから確保しておく
      # 1GB の VM（AMD の Micro）は、setup.sh が .env に小さい JAVA_OPTS を書く
      JAVA_OPTS: ${JAVA_OPTS:--Xms1200m -Xmx1200m -XX:+AlwaysPreTouch -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=192m}
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # VM の中のデータベース（2026年11月20日から。前は Neon）。COMPOSE_PROFILES=localdb のときだけ動く（deploy.sh が .env に書く）
  # パスワードは deploy.sh が .env の LOCAL_DB_PASSWORD に作る。外には出さない（ports なし）
  db:
    image: postgres:17-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: komorebi
      POSTGRES_USER: komorebi
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-}
    # 1GB の VM でも動くように小さく
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=128MB", "-c", "wal_buffers=1MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komorebi -d komorebi"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
