# ===== こもれび村 オンライン試作サーバー =====
# 環境変数が無いときは「自分のPCで試す」設定（H2のファイルDB）で動きます。

server.port=${PORT:8080}

# --- データベース ---
# ローカル: ./data/komorebi.mv.db に保存（H2 / PostgreSQL互換モード）
# 本番(Neon): DATABASE_URL=jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/komorebi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- ゲームの設定 ---
# 招待コード（友達に教える合言葉）
komorebi.invite-code=${INVITE_CODE:komorebi}
# 管理画面のログイン。ADMIN_PASSWORD が空なら、起動のたびにランダムなパスワードをログに出します
komorebi.admin.username=${ADMIN_USER:admin}
komorebi.admin.password=${ADMIN_PASSWORD:}
# ゲームのバージョン。game.js の CLIENT_VERSION と同じ値にして、更新のたびに上げます（上げると、つないでいる人に「再読み込みしてね」が出ます）
# Render の環境変数に古い GAME_VERSION が残っていても食い違わないよう、環境変数からは読みません
komorebi.version=0.12.0
# 時間の速さ：現実の1秒で進むゲーム内の分数（1.0なら1日が約18分、2.0なら約9分）
komorebi.time-rate=${TIME_RATE:1.0}
# WebSocketを受け付けるページの場所（カンマ区切り）。* はどこからでも
komorebi.allowed-origins=${ALLOWED_ORIGINS:*}

# --- 静的ファイル（ゲーム本体）はキャッシュさせない：更新がすぐ届くように ---
spring.web.resources.cache.cachecontrol.no-cache=true
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
