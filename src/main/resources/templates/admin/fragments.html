<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- どの画面にも出す「いまえらんでいる村」の帯 -->
<nav class="vbar" th:fragment="vbar">
  <span>いま見ている村：<b th:text="${adminVillage != null ? adminVillage.name() : 'こもれび村'}">こもれび村</b></span>
  <form method="get" class="row">
    <select name="village" onchange="this.form.submit()">
      <option th:each="v : ${allVillages}" th:value="${v.id()}" th:text="${v.name()}" th:selected="${adminVillage != null and v.id() == adminVillage.id()}">村</option>
    </select>
    <noscript><button class="btn ghost" type="submit">かえる</button></noscript>
  </form>
  <a class="btn ghost" href="/admin/villages">村の一覧</a>
</nav>
</body>
</html>
