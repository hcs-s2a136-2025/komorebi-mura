<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物をプレゼント｜こもれび村 管理人室</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
<header class="bar">
  <h1>物をプレゼント</h1>
  <span class="grow"></span>
  <a class="btn ghost" href="/admin">管理人室に戻る</a>
</header>
<main class="wrap">
  <p class="flash" th:if="${msg}" th:text="${msg}"></p>
  <section class="card">
    <h2>プレイヤーに物を届ける</h2>
    <p class="muted">不具合でなくなった物の埋め合わせなどに使えます。物の欄に名前を入れると候補が出るので、えらんでください（中身はアイテムのIDになります）。つないでいる人にはすぐ、つないでいない人には次に村に来たときに届きます。持ち物に入りきらない分は、その人の家の収納箱に入ります。<br>
      「本人へのひとこと」は、届いたときのお知らせにいっしょに出ます（空なら「管理人からプレゼントが届いた」）。</p>
    <datalist id="items">
      <option th:each="i : ${catalog}" th:value="${i.id()}" th:text="|${i.name()}${i.kind() == 'tool' ? '（道具）' : (i.kind() == 'furn' ? '（家具）' : '')}|">item</option>
    </datalist>
    <table class="players">
      <tr><th>なまえ</th><th>状態</th><th>プレゼント</th></tr>
      <tr th:each="r : ${rows}">
        <td><b th:text="${r.name()}">name</b><br><span class="muted" th:text="|ID ${r.id()}|">ID</span></td>
        <td><span th:text="${r.online()} ? 'つないでいる' : 'いない'">いない</span><br><span class="muted" th:if="${r.pending() > 0}" th:text="|届いていない ${r.pending()}件|"></span></td>
        <td>
          <form method="post" th:action="@{/admin/gift/{id}(id=${r.id()})}" class="row">
            <input name="item" list="items" placeholder="物（例：ベッド）" size="16" autocomplete="off" required>
            <input name="n" type="number" min="1" max="999" value="1" style="width:5em" required>
            <input name="text" placeholder="本人へのひとこと（なくてもOK）" size="22" maxlength="60" autocomplete="off">
            <button class="btn" type="submit">届ける</button>
          </form>
        </td>
      </tr>
    </table>
  </section>
</main>
</body>
</html>
