<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理人ログイン｜こもれび村</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="center">
  <form class="card login" method="post" th:action="@{/admin/login}">
    <h1>こもれび村 管理人室</h1>
    <p class="err" th:if="${param.error}">ユーザー名かパスワードがちがいます</p>
    <p class="ok" th:if="${param.logout}">ログアウトしました</p>
    <label>ユーザー名<input name="username" autocomplete="username" required autofocus></label>
    <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">ログイン</button>
  </form>
</body>
</html>
