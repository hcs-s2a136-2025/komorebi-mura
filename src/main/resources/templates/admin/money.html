<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お金の調整｜こもれび村 管理人室</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
<header class="bar">
  <h1>お金の調整</h1>
  <span class="grow"></span>
  <a class="btn ghost" href="/admin">管理人室に戻る</a>
</header>
<main class="wrap">
  <p class="flash" th:if="${msg}" th:text="${msg}"></p>
  <section class="card">
    <h2>プレイヤーの所持金</h2>
    <p class="muted">所持金は、その人が最後にサーバーへセーブしたときの金額です。足すか減らすかを選んで金額を入れると、つないでいる人にはすぐ、つないでいない人には次に村に来たときに反映されます。<br>
      「本人へのひとこと」を空のままにすると、本人の画面には何も出ずに、お金だけが変わります。書いたときは、その言葉といっしょにお知らせが出ます。</p>
    <table class="players">
      <tr><th>なまえ</th><th>所持金</th><th>状態</th><th>調整</th></tr>
      <tr th:each="r : ${rows}">
        <td><b th:text="${r.name()}">name</b><br><span class="muted" th:text="|ID ${r.id()}|">ID</span></td>
        <td><span th:text="${r.money() != null} ? ${#numbers.formatInteger(r.money(), 1, 'COMMA')} + ' G' : 'セーブなし'">0 G</span>
          <br><span class="muted" th:if="${r.pending() != 0}" th:text="|届いていない分 ${r.pending() > 0 ? '+' : ''}${#numbers.formatInteger(r.pending(), 1, 'COMMA')} G|"></span></td>
        <td th:text="${r.online()} ? 'つないでいる' : 'いない'">いない</td>
        <td>
          <form method="post" th:action="@{/admin/money/{id}(id=${r.id()})}" class="row">
            <select name="sign"><option value="plus">足す</option><option value="minus">減らす</option></select>
            <input name="amount" inputmode="numeric" placeholder="金額" size="9" autocomplete="off" required>
            <input name="text" placeholder="本人へのひとこと（なくてもOK）" size="22" maxlength="60" autocomplete="off">
            <button class="btn" type="submit">反映する</button>
          </form>
        </td>
      </tr>
    </table>
  </section>
</main>
</body>
</html>
