<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲームのランキング｜こもれび村 管理人室</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
<header class="bar">
  <h1>ゲームのランキング</h1>
  <span class="grow"></span>
  <a class="btn ghost" href="/admin">管理人室に戻る</a>
</header>
<nav th:replace="~{admin/fragments :: vbar}"></nav>
<main class="wrap">
  <p class="flash" th:if="${msg}" th:text="${msg}"></p>
  <section class="card">
    <h2>ランキングに出さない人</h2>
    <p class="muted">スマホのゲーム（こもれびブロック・つなぎ・マージ・にわとり・闘鶏）のランキングで、えらんだ人をほかの人の画面に出さないようにできます。<br>
      出さない人の画面では、自分はいつもどおりランキングに出ます（自分が隠されていることはわかりません）。スコアは消さないので、「戻す」でいつでも元どおりになります。ほかの人の順位は、その人をのぞいて数えます。</p>
    <table class="players">
      <tr><th>なまえ</th><th>いま</th><th></th></tr>
      <tr th:each="r : ${rows}">
        <td><b th:text="${r.name()}">name</b><br><span class="muted" th:text="|ID ${r.id()}|">ID</span></td>
        <td th:text="${r.hidden()} ? 'ほかの人には出さない' : '出す'">出す</td>
        <td>
          <form method="post" th:action="@{/admin/rank/{id}(id=${r.id()})}" class="row">
            <input type="hidden" name="hide" th:value="${r.hidden()} ? 0 : 1">
            <button class="btn" type="submit" th:text="${r.hidden()} ? '戻す' : 'ほかの人に出さない'">出さない</button>
          </form>
        </td>
      </tr>
    </table>
  </section>
</main>
</body>
</html>
