<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${t.title()}｜管理人室|">お便り</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
<header class="bar">
  <a class="btn ghost" th:href="@{/admin}">← 一覧へ</a>
  <h1 th:text="${t.title()}">タイトル</h1>
</header>
<main class="wrap">
  <p class="flash" th:if="${msg}" th:text="${msg}"></p>
  <section class="card">
    <p class="meta">
      <span class="cat" th:classappend="${t.category()}" th:text="${@fmt.label(t.category())}">不具合</span>
      <b th:text="${t.playerName()}">name</b>
      <span class="muted" th:text="|（ID ${t.playerId()}）・${@fmt.time(t.createdAt())} に届いた|"></span>
    </p>
    <details th:if="${t.context()}" open><summary>ゲームの状況</summary><pre th:text="${t.context()}"></pre></details>
    <form class="row" method="post" th:action="@{/admin/threads/{id}/status(id=${t.id()})}">
      <span class="muted">状態</span>
      <select name="status">
        <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s.name() == t.status()}" th:text="${@fmt.label(s.name())}"></option>
      </select>
      <button class="btn ghost" type="submit">変える</button>
    </form>
  </section>

  <section class="card chat">
    <div th:each="m : ${t.messages()}" class="msg" th:classappend="${m.sender() == 'ADMIN'} ? 'me' : 'them'">
      <div class="who" th:text="|${m.sender() == 'ADMIN' ? '管理人' : t.playerName()}・${@fmt.time(m.createdAt())}|"></div>
      <div class="body" th:text="${m.body()}"></div>
    </div>
    <form method="post" th:action="@{/admin/threads/{id}/reply(id=${t.id()})}" class="reply">
      <textarea name="body" rows="4" maxlength="2000" placeholder="返事を書く（ゲームの中で本人に届きます）" required></textarea>
      <button class="btn" type="submit">返事を送る</button>
    </form>
  </section>
</main>
</body>
</html>
